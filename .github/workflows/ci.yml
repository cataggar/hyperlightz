name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout pinned Hyperlight fork
        uses: actions/checkout@v6
        with:
          repository: cataggar/hyperlight
          ref: 643938e4741c1c7049386d1800013c21cdf617e4
          path: hyperlight
          submodules: recursive

      - name: Install Zig via signed ghr release
        uses: cataggar/ghr/actions/install@v0.8.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Install build prerequisites
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustup component add rustfmt --toolchain 1.94.0
          sudo apt-get update
          sudo apt-get install --yes clang lld libclang-dev just
          cargo install --locked --version 0.1.14 cargo-hyperlight

      - name: Check formatting
        run: just fmt-check

      - name: Test host and compile guest bindings
        run: just check

      - name: Build Hyperlight guest C API
        working-directory: hyperlight/src/hyperlight_guest_capi
        run: cargo hyperlight build --release

      - name: Link Zig guest examples
        run: >-
          zig build install
          -Dguest-capi="$GITHUB_WORKSPACE/hyperlight/target/x86_64-hyperlight-none/release/libhyperlight_guest_capi.a"
          --summary all

      - name: Build existing C and Rust guests
        working-directory: hyperlight
        run: |
          just build-c-guests release
          (cd src/tests/rust_guests && cargo hyperlight build -p simpleguest --release)

      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm

      - name: Run Zig examples
        run: |
          zig-out/bin/hello-host zig-out/bin/hello-guest
          zig-out/bin/counter-host zig-out/bin/counter-guest

      - name: Check existing guest interoperability
        run: |
          zig-out/bin/interoperability-host hyperlight/src/tests/c_guests/c_simpleguest/out/release/simpleguest
          zig-out/bin/interoperability-host hyperlight/src/tests/rust_guests/target/x86_64-hyperlight-none/release/simpleguest
